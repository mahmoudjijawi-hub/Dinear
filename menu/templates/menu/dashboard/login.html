{% extends 'menu/base.html' %}
{% load static dashboard_tags %}

{% block title %}تسجيل الدخول - Dinear{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-card">
        <h2>تسجيل الدخول</h2>
        <p class="subtitle">لوحة تحكم مطعم Dinear</p>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="{% dashboard_url auth_token ingress_token %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-accent login-btn">دخول</button>
        </form>
    </div>
</div>
{% endblock %}
